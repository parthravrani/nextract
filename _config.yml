# Build settings
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Collections
collections:
  solutions:
    output: true
    permalink: /:collection/:name/
  case-studies:
    output: true
    permalink: /:collection/:name/
  industries:
    output: true
    permalink: /:collection/:name/
  services:
    output: true
    permalink: /:collection/:name/
  scrapers:
    output: true
    permalink: /:collection/:name/
  apis:
    output: true
    permalink: /:collection/:name/
  intelligence:
    output: true
    permalink: /:collection/:name/
  datasets:
    output: true
    permalink: /:collection/:name/
  brands:
    output: true
    permalink: /brands/:name/
  blog:
    output: true
    permalink: /blog/:name/
  
# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
