# Navigation
navigation:
  - name: "Solutions"
    link: "/solutions/"
  - name: "Industries"
    link: "/industries/"
  - name: "Legal"
    link: "#"
    dropdown:
      - name: "Trust & Security"
        link: "/trust-security/"
      - name: "Terms of Service"
        link: "/terms/"
      - name: "Privacy Policy"
        link: "/privacy/"
      - name: "SLA"
        link: "/sla/"
      - name: "Legal Compliance"
        link: "/compliance/"
  - name: "About Us"
    link: "/about/"

# Build settings
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Collections
collections:
  solutions:
    output: true
    permalink: /:collection/:name/
  
# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
