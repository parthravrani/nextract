<div id="mobile-menu" class="hidden fixed inset-0 bg-white z-[100] p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-12">
        <div class="flex items-center gap-3">
            <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Nextract Logo" class="h-9 w-auto">
            <div>
                <h3 class="text-xl font-bold text-gray-900">Nextract</h3>
                <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide -mt-0.5">A Data Solutions Company</p>
            </div>
        </div>
        <button id="close-menu-button" class="p-2 hover:bg-gray-50 transition-colors">
            <i class="ri-close-line text-3xl text-gray-900"></i>
        </button>
    </div>
    
    <nav class="flex flex-col space-y-4">
        <!-- Scrava -->
        <a href="/scrava/" class="block py-4 px-4 text-lg font-semibold text-gray-900 hover:bg-orange-50 transition-colors{% if page.url == '/scrava/' %} bg-orange-50 text-orange-600{% endif %}">
            <div class="flex items-center gap-3">
                <i class="ri-amazon-line text-xl"></i>
                <span>Scrava</span>
            </div>
        </a>
        
        <!-- Amazon -->
        <a href="/amazon/" class="block py-4 px-4 text-lg font-semibold text-gray-900 hover:bg-orange-50 transition-colors{% if page.url == '/amazon/' or page.url contains '/amazon/' %} bg-orange-50 text-orange-600{% endif %}">
            <div class="flex items-center gap-3">
                <i class="ri-shopping-bag-3-line text-xl"></i>
                <span>Amazon</span>
            </div>
        </a>
        
        <!-- Products & Services -->
        <div>
            <button class="mobile-menu-toggle w-full flex items-center justify-between py-4 px-4 text-lg font-semibold text-gray-900 hover:bg-gray-50 transition-colors{% if page.url == '/products/' or page.url contains '/scrapers/' or page.url contains '/apis/' or page.url contains '/datasets/' or page.url contains '/services/' or page.url contains '/solutions/' or page.url == '/e-commerce/' or page.url == '/quick-commerce/' or page.url == '/food-delivery/' %} bg-gray-50 text-blue-600{% endif %}">
                <span>Products & Services</span>
                <i class="ri-arrow-down-s-line"></i>
            </button>
            <div class="mobile-menu-content hidden pl-6 space-y-1 mt-2">
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-4">Products</div>
                <a href="/products/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/products/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Self-Service Products</a>
                <a href="/scrapers/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url contains '/scrapers/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Scrapers</a>
                <a href="/apis/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url contains '/apis/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">APIs</a>
                
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 mt-4 px-4">Services</div>
                <a href="/solutions/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url contains '/solutions/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Custom Solutions</a>
                <a href="/services/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url contains '/services/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Industry Services</a>
                
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 mt-4 px-4">Solutions</div>
                <a href="/e-commerce/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/e-commerce/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">E-commerce</a>
                <a href="/quick-commerce/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/quick-commerce/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Quick Commerce</a>
                <a href="/food-delivery/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/food-delivery/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Food Delivery</a>
                
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 mt-4 px-4">Resources</div>
                <a href="/blog/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/blog/' or page.url contains '/blog/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Blog</a>
                <a href="/case-studies/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url contains '/case-studies/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Case Studies</a>
            </div>
        </div>
        
        <!-- Company -->
        <div>
            <a href="/about/" class="block py-4 px-4 text-lg font-semibold text-gray-900 hover:bg-gray-50 transition-colors{% if page.url == '/about/' or page.url == '/contact/' %} bg-gray-50 text-blue-600{% endif %}">
                <div class="flex items-center gap-3">
                    <i class="ri-information-line text-xl"></i>
                    <span>Company</span>
                </div>
            </a>
            <div class="pl-6 space-y-1 mt-2">
                <a href="/about/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/about/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">About</a>
                <a href="/contact/" class="block py-2 px-4 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors{% if page.url == '/contact/' %} bg-gray-50 text-blue-600 font-semibold{% endif %}">Contact</a>
            </div>
        </div>
        
        <!-- CTA Button -->
        <div class="pt-6 border-t border-gray-200">
            <a href="/contact/" class="block w-full px-8 py-4 bg-gray-900 text-white font-semibold text-center hover:bg-gray-800 transition-colors">
                Get Started
                <i class="ri-arrow-right-line ml-2"></i>
            </a>
        </div>
    </nav>
</div>
