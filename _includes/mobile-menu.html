<div id="mobile-menu" class="hidden fixed inset-0 bg-white z-[100] p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-12">
        <div class="flex items-center gap-3">
            <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Nextract Logo" class="h-9 w-auto">
            <div>
                <h3 class="text-xl font-black tracking-tight text-gray-900">Nextract</h3>
                <p class="text-xs font-medium text-gray-600">Data Solutions</p>
            </div>
        </div>
        <button id="close-menu-button" class="p-2 hover:bg-gray-50 transition-colors">
            <i class="ri-close-line text-3xl text-gray-900"></i>
        </button>
    </div>
    <nav class="flex flex-col space-y-1">
        {% for nav in site.navigation %}
            {% if nav.dropdown %}
                <div class="w-full">
                    <button id="mobile-legal-button" class="w-full flex items-center justify-between py-4 px-4 text-base font-semibold text-gray-900 hover:bg-gray-50 transition-colors">
                        <span>{{ nav.name }}</span>
                        <i id="mobile-legal-icon" class="ri-add-line text-xl transition-transform duration-300"></i>
                    </button>
                    <div id="mobile-legal-submenu" class="hidden flex-col space-y-1 pt-2 pb-4 pl-6">
                        {% for dropdown_item in nav.dropdown %}
                            <a href="{{ dropdown_item.link | relative_url }}" class="mobile-nav-link block py-3 px-4 text-sm text-gray-600 hover:text-gray-900 transition-colors flex items-center gap-2 group">
                                <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                                {{ dropdown_item.name }}
                            </a>
                        {% endfor %}
                    </div>
                </div>
            {% else %}
                <a href="{{ nav.link | relative_url }}" class="mobile-nav-link block py-4 px-4 text-base font-semibold text-gray-900 hover:bg-gray-50 transition-colors{% if page.url == nav.link %} bg-gray-50 text-blue-600{% endif %}">{{ nav.name }}</a>
            {% endif %}
        {% endfor %}
        <div class="pt-8 border-t border-gray-200">
            <a href="/contact/" class="w-full px-8 py-4 bg-gray-900 text-white font-bold flex items-center justify-center gap-2 hover:bg-blue-600 transition-all">
                Contact Us
                <i class="ri-arrow-right-line"></i>
            </a>
        </div>
    </nav>
</div>
