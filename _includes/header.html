<header id="main-header" class="sticky top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 transition-all duration-300">
    <div class="container mx-auto px-6 py-5 flex justify-between items-center max-w-7xl">
        
        <!-- Logo -->
        <div class="flex-1 flex justify-start">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 cursor-pointer group">
                <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Nextract Logo" class="h-9 w-auto">
                <div>
                    <h3 class="text-xl font-black tracking-tight text-gray-900 group-hover:text-blue-600 transition-colors">
                        Nextract
                    </h3>
                    <p class="text-xs font-medium text-gray-600 group-hover:text-blue-600 transition-colors">
                        Data Solutions
                    </p>
                </div>
            </a>
        </div>
        
        <!-- Navigation -->
        <nav class="hidden lg:flex items-center gap-1 font-semibold">
            {% for nav in site.navigation %}
                {% if nav.dropdown %}
                    <div class="relative" id="legal-dropdown-container">
                        <button id="legal-dropdown-button" class="text-gray-900 hover:text-blue-600 transition-colors flex items-center gap-1 py-3 px-5 relative group">
                            <span class="text-sm">{{ nav.name }}</span>
                            <i class="ri-arrow-down-s-line text-xs transition-transform duration-300 group-hover:rotate-180"></i>
                            <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
                        </button>
                        <div id="legal-dropdown-menu" class="absolute hidden bg-white border border-gray-200 mt-2 py-2 w-64 z-50">
                            <div class="px-4 py-3 bg-gray-50 border-b border-gray-200">
                                <p class="text-xs font-bold text-blue-600 uppercase tracking-widest">Legal & Compliance</p>
                            </div>
                            {% for dropdown_item in nav.dropdown %}
                                <a href="{{ dropdown_item.link | relative_url }}" class="block px-4 py-3 text-gray-900 hover:bg-gray-50 hover:text-blue-600 transition-all text-sm flex items-center gap-2 group/item">
                                    <span class="text-xs opacity-0 group-hover/item:opacity-100 transition-opacity">→</span>
                                    <span>{{ dropdown_item.name }}</span>
                                </a>
                            {% endfor %}
                        </div>
                    </div>
                {% else %}
                    <a href="{{ nav.link | relative_url }}" class="text-gray-900 hover:text-blue-600 transition-colors py-3 px-5 relative group text-sm{% if page.url == nav.link %} text-blue-600 font-bold{% endif %}">
                        <span>{{ nav.name }}</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url == nav.link %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                {% endif %}
            {% endfor %}
        </nav>

        <!-- CTA Button -->
        <div class="flex-1 hidden lg:flex items-center justify-end">
            <a href="/contact/" class="px-8 py-3 bg-gray-900 text-white font-bold text-sm hover:bg-blue-600 transition-all inline-flex items-center gap-2 group">
                Contact
                <span class="group-hover:translate-x-1 transition-transform">→</span>
            </a>
        </div>

        <!-- Mobile Menu Button -->
        <button id="mobile-menu-button" class="lg:hidden p-2 hover:bg-gray-50 transition-colors group">
            <i class="ri-menu-3-line text-2xl text-gray-900 group-hover:text-blue-600 transition-colors"></i>
        </button>
    </div>
</header>
