<header id="main-header" class="bg-white border-b-2 border-gray-200 shadow-lg">
    <div class="container mx-auto px-6 py-4 max-w-7xl">
        
        <!-- Top Row: Logo and Mobile Menu -->
        <div class="flex items-center justify-between mb-4 lg:mb-0">
            <!-- Logo -->
            <div class="flex-1 flex justify-start">
                <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Nextract Logo" class="h-10 w-auto transition-transform group-hover:scale-105">
                    </div>
                    <div>
                        <h3 class="text-xl font-black tracking-tight text-gray-900 group-hover:text-blue-600 transition-colors">
                            Nextract
                        </h3>
                        <p class="text-xs font-semibold text-gray-500 group-hover:text-blue-600 transition-colors uppercase tracking-wide">
                            Data Solutions
                        </p>
                    </div>
                </a>
            </div>

            <!-- Get Started Button - Desktop Only -->
            <div class="hidden lg:block">
                <a href="/contact/" class="px-6 py-2.5 bg-gray-900 text-white font-bold text-sm hover:bg-blue-600 transition-all inline-flex items-center gap-2 group shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    Get Started
                    <span class="group-hover:translate-x-1 transition-transform">→</span>
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="mobile-menu-button" class="lg:hidden p-2.5 hover:bg-gray-50 transition-colors group">
                <i class="ri-menu-3-line text-2xl text-gray-900 group-hover:text-blue-600 transition-colors"></i>
            </button>
        </div>
        
        <!-- Desktop Navigation -->
        <div class="hidden lg:block">
            <!-- Primary Navigation Row -->
            <nav class="flex items-center gap-3 mb-4 pb-4 border-b border-gray-200">
                <!-- Products Group -->
                <div class="flex items-center gap-2">
                    <a href="/products/" class="text-gray-900 hover:text-blue-600 transition-colors py-2 px-4 relative group text-sm font-bold{% if page.url == '/products/' %} text-blue-600{% endif %}">
                        <span>Products</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url == '/products/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/scrapers/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url contains '/scrapers/' %} text-blue-600 font-bold{% endif %}">
                        <span>Scrapers</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/scrapers/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/apis/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url contains '/apis/' %} text-blue-600 font-bold{% endif %}">
                        <span>APIs</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/apis/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/datasets/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url contains '/datasets/' %} text-blue-600 font-bold{% endif %}">
                        <span>Datasets</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/datasets/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                </div>
                
                <span class="text-gray-300 text-lg">|</span>
                
                <!-- Services Group -->
                <div class="flex items-center gap-2">
                    <a href="/services/" class="text-gray-900 hover:text-blue-600 transition-colors py-2 px-4 relative group text-sm font-bold{% if page.url contains '/services/' %} text-blue-600{% endif %}">
                        <span>Services</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/services/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/solutions/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url contains '/solutions/' %} text-blue-600 font-bold{% endif %}">
                        <span>Solutions</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/solutions/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                </div>
                
                <span class="text-gray-300 text-lg">|</span>
                
                <!-- Resources Group -->
                <div class="flex items-center gap-2">
                    <a href="/industries/" class="text-gray-900 hover:text-blue-600 transition-colors py-2 px-4 relative group text-sm font-bold{% if page.url contains '/industries/' %} text-blue-600{% endif %}">
                        <span>Industries</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/industries/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/intelligence/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url contains '/intelligence/' %} text-blue-600 font-bold{% endif %}">
                        <span>Intelligence</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/intelligence/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/case-studies/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url contains '/case-studies/' %} text-blue-600 font-bold{% endif %}">
                        <span>Case Studies</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url contains '/case-studies/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                </div>
                
                <span class="text-gray-300 text-lg">|</span>
                
                <!-- Company Group -->
                <div class="flex items-center gap-2">
                    <a href="/about/" class="text-gray-900 hover:text-blue-600 transition-colors py-2 px-4 relative group text-sm font-bold{% if page.url == '/about/' %} text-blue-600{% endif %}">
                        <span>About</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url == '/about/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                    <a href="/contact/" class="text-gray-700 hover:text-blue-600 transition-colors py-2 px-3 relative group text-sm font-medium{% if page.url == '/contact/' %} text-blue-600 font-bold{% endif %}">
                        <span>Contact</span>
                        <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-600 {% if page.url == '/contact/' %}scale-x-100{% else %}scale-x-0 group-hover:scale-x-100{% endif %} transition-transform duration-300 origin-left"></span>
                    </a>
                </div>
            </nav>
            
            <!-- Secondary Navigation Row (Support & Legal) -->
            <nav class="flex items-center gap-4 text-xs">
                <a href="/testimonials/" class="text-gray-500 hover:text-gray-900 transition-colors font-semibold px-3 py-1.5 hover:bg-gray-50{% if page.url == '/testimonials/' %} text-gray-900 bg-gray-50{% endif %}">
                    Testimonials
                </a>
                <span class="text-gray-300">•</span>
                <a href="/faq/" class="text-gray-500 hover:text-gray-900 transition-colors font-semibold px-3 py-1.5 hover:bg-gray-50{% if page.url == '/faq/' %} text-gray-900 bg-gray-50{% endif %}">
                    FAQ
                </a>
                <span class="text-gray-300">•</span>
                <a href="/trust-security/" class="text-gray-500 hover:text-gray-900 transition-colors font-semibold px-3 py-1.5 hover:bg-gray-50{% if page.url == '/trust-security/' %} text-gray-900 bg-gray-50{% endif %}">
                    Trust & Security
                </a>
                <span class="text-gray-300">•</span>
                <a href="/terms/" class="text-gray-500 hover:text-gray-900 transition-colors font-semibold px-3 py-1.5 hover:bg-gray-50{% if page.url == '/terms/' %} text-gray-900 bg-gray-50{% endif %}">
                    Terms
                </a>
                <span class="text-gray-300">•</span>
                <a href="/privacy/" class="text-gray-500 hover:text-gray-900 transition-colors font-semibold px-3 py-1.5 hover:bg-gray-50{% if page.url == '/privacy/' %} text-gray-900 bg-gray-50{% endif %}">
                    Privacy
                </a>
            </nav>
        </div>
    </div>
</header>
