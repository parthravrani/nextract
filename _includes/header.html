<header class="sticky top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        
        <div class="flex-1 flex justify-start">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 cursor-pointer">
                <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Nextract Logo" class="h-8 w-auto">
                <div>
                    <h3 class="text-xl font-extrabold tracking-tighter leading-tight text-gray-900">
                    Nextract
                    </h3>
                    <p class="text-sm font-medium leading-tight text-gray-600">
                    Data Solutions
                    </p>
                </div>
            </a>
        </div>
        
        <nav class="hidden lg:flex items-center space-x-8 font-semibold">
            {% for nav in site.navigation %}
                {% if nav.dropdown %}
                    <div class="relative" id="legal-dropdown-container">
                        <button id="legal-dropdown-button" class="text-gray-600 hover:text-blue-600 transition-colors flex items-center">
                            {{ nav.name }} <i class="ri-arrow-down-s-line ml-1"></i>
                        </button>
                        <div id="legal-dropdown-menu" class="absolute hidden bg-white shadow-lg rounded-lg mt-2 py-2 w-48 border border-gray-100 z-50">
                            {% for dropdown_item in nav.dropdown %}
                                <a href="{{ dropdown_item.link | relative_url }}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">{{ dropdown_item.name }}</a>
                            {% endfor %}
                        </div>
                    </div>
                {% else %}
                    <a href="{{ nav.link | relative_url }}" class="text-gray-600 hover:text-blue-600 transition-colors{% if page.url == nav.link %} text-blue-600 font-bold{% endif %}">{{ nav.name }}</a>
                {% endif %}
            {% endfor %}
        </nav>

        <div class="flex-1 hidden lg:flex items-center justify-end gap-4">
            <a href="{{ '/assets/deck/Nextract Data Solutions.pdf' | relative_url }}" target="_blank" class="cta-secondary px-5 py-2.5 font-bold text-sm"><i class="ri-download-2-line"></i> Deck</a>
            <a href="#contact-shared" class="cta-primary px-5 py-2.5 text-white font-bold text-sm">Get a Free Quote</a>
        </div>

        <button id="mobile-menu-button" class="lg:hidden"><i class="ri-menu-3-line text-2xl"></i></button>
    </div>
</header>
