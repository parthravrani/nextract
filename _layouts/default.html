<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Enterprise Web Scraping & Data Extraction Services{% endif %}</title>
    <meta name="title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Enterprise Web Scraping & Data Extraction Services{% endif %}">
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
    <meta name="author" content="{{ site.title }}">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.canonical_url }}{{ page.url }}">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.canonical_url }}{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Enterprise Web Scraping & Data Extraction Services{% endif %}">
    <meta property="og:description" content="{% if page.og_description %}{{ page.og_description }}{% else %}{{ page.description | default: site.description }}{% endif %}">
    <meta property="og:image" content="{% if page.og_image %}{{ page.og_image }}{% else %}{{ site.canonical_url }}/assets/images/og-image.jpg{% endif %}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ site.canonical_url }}{{ page.url }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Enterprise Web Scraping & Data Extraction Services{% endif %}">
    <meta name="twitter:description" content="{% if page.twitter_description %}{{ page.twitter_description }}{% else %}{{ page.description | default: site.description }}{% endif %}">
    <meta name="twitter:image" content="{% if page.twitter_image %}{{ page.twitter_image }}{% else %}{{ site.canonical_url }}/assets/images/twitter-image.jpg{% endif %}">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "{% if page.url == '/' %}Organization{% else %}WebPage{% endif %}",
      {% if page.url == '/' %}"name": "{{ site.title }}",
      "url": "{{ site.canonical_url }}",
      "logo": "{{ site.canonical_url }}/assets/images/logo.png",
      "description": "{{ site.description }}",
      "email": "{{ site.email }}",
      "telephone": "{{ site.phone }}",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "B-1308, Eastface",
        "addressLocality": "Ahmedabad",
        "addressRegion": "Gujarat",
        "postalCode": "380058",
        "addressCountry": "IN"
      },
      "sameAs": [
        "{{ site.linkedin_url }}",
        "{{ site.instagram_url }}"
      ],
      "foundingDate": "{{ site.founded_year }}",
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "value": "10-50"
      }{% else %}"name": "{{ page.title }} | {{ site.title }}",
      "url": "{{ site.canonical_url }}{{ page.url }}",
      "description": "{{ page.description | default: site.description }}",
      "inLanguage": "en-US",
      "isPartOf": {
        "@type": "WebSite",
        "name": "{{ site.title }}",
        "url": "{{ site.canonical_url }}"
      }{% endif %}
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    
    <!-- Custom Styles -->
    <style>
        /* Fixed Color Palette */
        :root {
            --color-blue: #0052FF;
            --color-blue-dark: #0045D6;
            --color-blue-light: #E6F0FF;
            --color-orange: #FF6B35;
            --color-orange-dark: #E55A2B;
            --color-black: #000000;
            --color-white: #FFFFFF;
            --color-gray-light: #F5F5F5;
            --color-gray-border: #E5E7EB;
            --color-gray-text: #6B7280;
            --color-gray-dark: #1F2937;
        }
        
        body { font-family: 'Montserrat', sans-serif; background-color: var(--color-white); color: var(--color-gray-dark); }
        .section-light { background-color: var(--color-gray-light); }
        .section-dark { background-color: var(--color-gray-dark); color: var(--color-white); }
        .gradient-text { background: linear-gradient(90deg, var(--color-blue), var(--color-blue-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-gradient { 
            background-color: var(--color-blue); 
            background-image: linear-gradient(225deg, var(--color-blue) 0%, var(--color-blue-dark) 100%);
            position: relative;
            overflow: hidden;
        }
        .cta-primary { 
            background-color: var(--color-blue); 
            transition: background-color 0.2s ease;
        }
        .cta-primary:hover { 
            background-color: var(--color-blue-dark); 
        }
        .cta-secondary {
            background-color: transparent;
            border: 2px solid var(--color-blue);
            color: var(--color-blue);
            transition: all 0.2s ease;
        }
        .cta-secondary:hover {
            background-color: var(--color-blue);
            color: var(--color-white);
        }
        .hero-cta-primary { 
            background-color: var(--color-white); 
            color: var(--color-blue-dark); 
            transition: background-color 0.2s ease;
        }
        .hero-cta-primary:hover { 
            background-color: var(--color-gray-light);
        }
        .hero-cta-secondary { 
            background-color: rgba(255, 255, 255, 0.1); 
            border: 2px solid rgba(255, 255, 255, 0.3); 
            color: var(--color-white); 
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .hero-cta-secondary:hover { 
            background-color: rgba(255, 255, 255, 0.2); 
            border-color: rgba(255, 255, 255, 0.5);
        }
        .card-style { 
            background-color: var(--color-white); 
            border: 1px solid var(--color-gray-border); 
            transition: border-color 0.2s ease;
        }
        .card-style:hover { 
            border-color: var(--color-blue);
        }
        .dark-card { 
            background-color: var(--color-gray-dark); 
            border: 1px solid var(--color-gray-border);
            transition: border-color 0.2s ease;
        }
        .dark-card:hover {
            border-color: var(--color-blue);
        }
        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .reveal.visible { 
            opacity: 1; 
            transform: translateY(0); 
        }
        .form-input { 
            width: 100%; 
            background-color: var(--color-white); 
            border: 1px solid var(--color-gray-border); 
            color: var(--color-gray-dark); 
            padding: 0.75rem 1rem; 
            transition: border-color 0.2s ease;
            font-family: 'Montserrat', sans-serif;
        }
        .form-input::placeholder {
            color: var(--color-gray-text);
            transition: color 0.3s ease;
        }
        .form-input:hover {
            border-color: var(--color-gray-text);
        }
        .form-input:focus { 
            outline: none; 
            border-color: var(--color-blue);
            background-color: var(--color-white);
        }
        
        /* Form success state */
        .form-input.success {
            border-color: var(--color-blue);
            background-color: var(--color-blue-light);
        }
        
        /* Form error state */
        .form-input.error {
            border-color: var(--color-orange);
            background-color: rgba(255, 107, 53, 0.05);
        }
        /* Legal page typography */
        .legal-content h2 { font-size: 1.875rem; font-weight: 800; margin-bottom: 1.5rem; }
        .legal-content h3 { font-size: 1.25rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; }
        .legal-content p { margin-bottom: 1rem; line-height: 1.75; color: var(--color-gray-text); }
        .legal-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .legal-content li { margin-bottom: 0.5rem; }
        .legal-content .disclaimer { font-style: italic; color: var(--color-gray-text); text-align: center; margin-bottom: 2rem; }

        /* Accordion Styles */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-item.active .accordion-content {
            max-height: 500px;
        }
        .accordion-item.active .accordion-icon {
            transform: rotate(180deg);
        }
        .accordion-icon {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-header:hover {
            background-color: var(--color-blue-light);
        }
        
        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }
        
        /* Navbar scroll effect */
        header.scrolled {
            background-color: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid var(--color-gray-border);
        }
        
        /* Dropdown animation */
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }
        
        /* Mobile menu animation */
        #mobile-menu {
            animation: slide-in 0.3s ease-out;
        }
        @keyframes slide-in {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
        
        /* Modern Scroll Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }
        
        /* Modern button hover effects */
        .modern-btn {
            position: relative;
            overflow: hidden;
        }
        
        .modern-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .modern-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        /* Glassmorphism effect */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        /* Number counter animation */
        @keyframes countUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .number-animate {
            animation: countUp 0.8s ease-out forwards;
        }
    </style>

    {% seo %}
</head>
<body class="antialiased">
    {% include header.html %}
    {% include mobile-menu.html %}
    
    {{ content }}

    {% include footer.html %}
    
    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
</html>
